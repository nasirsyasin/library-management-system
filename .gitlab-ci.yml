stages:
  - test
  - publish

variables:
  RELEASE_BRANCH: "main"
  DOCKERHUB_NAMESPACE: "nasirsyasin"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run build
    - npm test --workspace=frontend -- --testTimeout=15000
    - npm test --workspace=api-gateway
    - npm test --workspace=services/catalog-service
    - npm test --workspace=services/borrow-service -- --passWithNoTests
    - npm test --workspace=services/reservation-service -- --passWithNoTests

publish-images:
  stage: publish
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $RELEASE_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      set -eu
      : "${DOCKERHUB_USERNAME:?Set the Docker Hub username CI/CD variable}"
      : "${DOCKERHUB_TOKEN:?Set the Docker Hub access-token CI/CD variable}"
      : "${DOCKERHUB_NAMESPACE:=nasirsyasin}"
      : "${RELEASE_BRANCH:=main}"

      printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      commit_tag="$CI_COMMIT_SHA"

      build_and_push() {
        image_name="$1"
        context="$2"
        image="docker.io/${DOCKERHUB_NAMESPACE}/library-management-${image_name}"
        docker build --pull --tag "${image}:${commit_tag}" "$context"
        docker push "${image}:${commit_tag}"
        if [ "${CI_COMMIT_BRANCH:-}" = "$RELEASE_BRANCH" ]; then
          docker tag "${image}:${commit_tag}" "${image}:latest"
          docker push "${image}:latest"
        fi
      }

      build_and_push api-gateway ./api-gateway
      build_and_push catalog-service ./services/catalog-service
      build_and_push borrow-service ./services/borrow-service
      build_and_push reservation-service ./services/reservation-service

      frontend_image="docker.io/${DOCKERHUB_NAMESPACE}/library-management-frontend"
      docker build --pull \
        --build-arg "VITE_API_BASE_URL=${FRONTEND_API_BASE_URL:-http://localhost:8080}" \
        --tag "${frontend_image}:${commit_tag}" \
        ./frontend
      docker push "${frontend_image}:${commit_tag}"
      if [ "${CI_COMMIT_BRANCH:-}" = "$RELEASE_BRANCH" ]; then
        docker tag "${frontend_image}:${commit_tag}" "${frontend_image}:latest"
        docker push "${frontend_image}:latest"
      fi
