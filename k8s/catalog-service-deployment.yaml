apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: library-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: catalog-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: library-secrets
          env:
            - name: CATALOG_DB_HOST
              value: catalog-db
            - name: CATALOG_DB_PORT
              value: "5432"
