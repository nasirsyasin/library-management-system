apiVersion: v1
kind: Secret
metadata:
  name: library-secrets
  namespace: library-system
type: Opaque
stringData:
  JWT_SECRET: replace-this-with-a-random-secret-of-at-least-32-characters
  CATALOG_DB_NAME: catalog
  CATALOG_DB_USER: catalog_user
  CATALOG_DB_PASSWORD: replace-catalog-db-password
  BORROW_DB_NAME: borrow
  BORROW_DB_USER: borrow_user
  BORROW_DB_PASSWORD: replace-borrow-db-password
  RESERVATION_DB_NAME: reservation
  RESERVATION_DB_USER: reservation_user
  RESERVATION_DB_PASSWORD: replace-reservation-db-password
  IDENTITY_DB_NAME: identity
  IDENTITY_DB_USER: identity_user
  IDENTITY_DB_PASSWORD: replace-identity-db-password
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ReplaceWithUniquePassword2026!
  ADMIN_NAME: Library Administrator
