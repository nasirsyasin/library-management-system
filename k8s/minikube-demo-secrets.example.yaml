apiVersion: v1
kind: Secret
metadata:
  name: library-demo-secrets
  namespace: library-demo
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_A_UNIQUE_RANDOM_VALUE_AT_LEAST_32_CHARACTERS
  CATALOG_DB_NAME: catalog
  CATALOG_DB_USER: catalog_user
  CATALOG_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_CATALOG_PASSWORD
  BORROW_DB_NAME: borrow
  BORROW_DB_USER: borrow_user
  BORROW_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_BORROW_PASSWORD
  RESERVATION_DB_NAME: reservation
  RESERVATION_DB_USER: reservation_user
  RESERVATION_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_RESERVATION_PASSWORD
  IDENTITY_DB_NAME: identity
  IDENTITY_DB_USER: identity_user
  IDENTITY_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_IDENTITY_PASSWORD
  ADMIN_EMAIL: REPLACE_WITH_ADMIN_EMAIL
  ADMIN_PASSWORD: REPLACE_WITH_A_STRONG_ADMIN_PASSWORD
  ADMIN_NAME: Library Administrator
