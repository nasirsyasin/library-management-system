apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: library-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      containers:
        - name: reservation-service
          image: reservation-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: library-secrets
          env:
            - name: RESERVATION_DB_HOST
              value: reservation-db
            - name: RESERVATION_DB_PORT
              value: "5432"
            - name: API_GATEWAY_URL
              value: http://api-gateway:8080
