apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-db-data
  namespace: library-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-db
  namespace: library-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-db
  template:
    metadata:
      labels:
        app: identity-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: IDENTITY_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: IDENTITY_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: IDENTITY_DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: identity-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: identity-data
          persistentVolumeClaim:
            claimName: identity-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: identity-db
  namespace: library-system
spec:
  selector:
    app: identity-db
  ports:
    - port: 5432
      targetPort: 5432