apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: library-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h catalog-db -p 5432 -U \"$CATALOG_DB_USER\" -d \"$CATALOG_DB_NAME\"; do sleep 2; done"]
          envFrom:
            - secretRef:
                name: library-demo-secrets
      containers:
        - name: catalog-service
          image: docker.io/nasirsyasin/library-management-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: library-demo-secrets
          env:
            - name: PORT
              value: "8081"
            - name: CATALOG_DB_HOST
              value: catalog-db
            - name: CATALOG_DB_PORT
              value: "5432"
            - name: BORROW_SERVICE_URL
              value: http://borrow-service:8082
            - name: RESERVATION_SERVICE_URL
              value: http://reservation-service:8083
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
