name: library-management-system

services:
  catalog-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      POSTGRES_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CATALOG_DB_LOCAL_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [library-net]

  borrow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BORROW_DB_NAME:?Set BORROW_DB_NAME in .env}
      POSTGRES_USER: ${BORROW_DB_USER:?Set BORROW_DB_USER in .env}
      POSTGRES_PASSWORD: ${BORROW_DB_PASSWORD:?Set BORROW_DB_PASSWORD in .env}
    volumes:
      - borrow-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${BORROW_DB_LOCAL_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [library-net]

  reservation-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESERVATION_DB_NAME:?Set RESERVATION_DB_NAME in .env}
      POSTGRES_USER: ${RESERVATION_DB_USER:?Set RESERVATION_DB_USER in .env}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASSWORD:?Set RESERVATION_DB_PASSWORD in .env}
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${RESERVATION_DB_LOCAL_PORT:-15434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [library-net]

  identity-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:?Set IDENTITY_DB_NAME in .env}
      POSTGRES_USER: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER in .env}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${IDENTITY_DB_LOCAL_PORT:-15435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [library-net]

  catalog-service:
    image: docker.io/${DOCKERHUB_NAMESPACE:-nasirsyasin}/library-management-catalog-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8081"
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in .env}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in .env}
      BORROW_SERVICE_URL: http://borrow-service:8082
      RESERVATION_SERVICE_URL: http://reservation-service:8083
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [library-net]

  reservation-service:
    image: docker.io/${DOCKERHUB_NAMESPACE:-nasirsyasin}/library-management-reservation-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8083"
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      RESERVATION_DB_HOST: reservation-db
      RESERVATION_DB_PORT: "5432"
      RESERVATION_DB_NAME: ${RESERVATION_DB_NAME:?Set RESERVATION_DB_NAME in .env}
      RESERVATION_DB_USER: ${RESERVATION_DB_USER:?Set RESERVATION_DB_USER in .env}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?Set RESERVATION_DB_PASSWORD in .env}
      API_GATEWAY_URL: http://api-gateway:8080
      CATALOG_SERVICE_URL: http://catalog-service:8081
    depends_on:
      reservation-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8083/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [library-net]

  borrow-service:
    image: docker.io/${DOCKERHUB_NAMESPACE:-nasirsyasin}/library-management-borrow-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8082"
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      BORROW_DB_HOST: borrow-db
      BORROW_DB_PORT: "5432"
      BORROW_DB_NAME: ${BORROW_DB_NAME:?Set BORROW_DB_NAME in .env}
      BORROW_DB_USER: ${BORROW_DB_USER:?Set BORROW_DB_USER in .env}
      BORROW_DB_PASSWORD: ${BORROW_DB_PASSWORD:?Set BORROW_DB_PASSWORD in .env}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8083
    depends_on:
      borrow-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [library-net]

  api-gateway:
    image: docker.io/${DOCKERHUB_NAMESPACE:-nasirsyasin}/library-management-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Library Administrator}
      GATEWAY_DB_HOST: identity-db
      GATEWAY_DB_PORT: "5432"
      GATEWAY_DB_NAME: ${IDENTITY_DB_NAME:?Set IDENTITY_DB_NAME in .env}
      GATEWAY_DB_USER: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER in .env}
      GATEWAY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      BORROW_SERVICE_URL: http://borrow-service:8082
      RESERVATION_SERVICE_URL: http://reservation-service:8083
    ports:
      - "8080:8080"
    depends_on:
      identity-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      borrow-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [library-net]

  frontend:
    image: docker.io/${DOCKERHUB_NAMESPACE:-nasirsyasin}/library-management-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [library-net]

networks:
  library-net:
    driver: bridge

volumes:
  catalog-db-data:
  borrow-db-data:
  reservation-db-data:
  identity-db-data: